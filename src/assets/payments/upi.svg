<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 38">
  <rect width="72" height="38" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- UPI in brand colors: U=teal, P=dark, I=orange with arrows -->
  <text x="10" y="25" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="900" fill="#097939">U</text>
  <text x="24" y="25" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="900" fill="#333">P</text>
  <text x="37" y="25" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="900" fill="#FF6B00">I</text>
  <!-- two diagonal arrows -->
  <line x1="52" y1="10" x2="62" y2="28" stroke="#097939" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="58,10 62,10 62,14" fill="none" stroke="#097939" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="62" y1="10" x2="52" y2="28" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="52,24 52,28 56,28" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
